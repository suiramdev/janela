# Janela's Tauri shell.
#
# Thin by rule: the window, the native menu, notifications, file dialogs, the
# sidecar lifecycle and the socket bridge. Nothing here reads a protocol frame,
# so nothing here needs a dependency that knows what a session is.
[package]
name = "janela"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
libc = "0.2"
log = "0.4"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.9"
tauri-plugin-notification = "2.3"
tauri-plugin-opener = "2.5"
tokio = { version = "1", features = ["io-util", "macros", "net", "sync", "time"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
