name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. No job here writes to the repository; anything that
# needs more must request it at the job level and say why.
permissions:
  contents: read

env:
  # Keep in sync with `packageManager` in package.json, and never below the
  # lockfile's floor: the scoped `overrides` entry makes bun.lock
  # lockfileVersion 3, which Bun before 1.4.0 refuses to parse at all — so an
  # older pin fails `bun install --frozen-lockfile` before a single test runs.
  BUN_VERSION: "1.4.2"
  # Bun is the runtime, but Prisma's CLI shells out to Node and refuses anything
  # outside its supported range — Node 23 in particular is rejected outright. So
  # generation and migration need a pinned Node even though nothing we ship runs
  # on it. Keep in sync with .node-version.
  NODE_VERSION: "24.14.0"

jobs:
  # The gate that matches `bun run check`, which is what a contributor runs before
  # pushing. If these ever diverge, the local command is the one to fix.
  check:
    name: Lint, typecheck & test
    runs-on: macos-15
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved to point
      # at new code, a SHA cannot. Update deliberately, with the version comment.
      # Every pin here runs on the node24 runtime: GitHub has deprecated node20
      # and currently forces those actions onto node24 anyway, with a warning on
      # every job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job pushes, so leaving a credential in .git/config only widens the
          # blast radius of a compromised build step.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Node is here for Prisma's CLI and nothing else. From v5 setup-node
          # caches by itself when `packageManager` is set, and ours names bun —
          # there is no npm lockfile to hash and bun's own cache is not its
          # business.
          package-manager-cache: false

      # --frozen-lockfile: CI must not resolve a different tree than the
      # contributor did. A lockfile that needs updating is a change to review.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the database client
        run: bun run generate

      # Lint is oxlint + oxfmt --check + the layering gate. The gate is the one
      # that replaces what a compiler used to enforce, so it is not optional and
      # it does not degrade to a review comment.
      - name: Lint, format check, and layering
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # The PTY tests spawn real children through the Rust dylib, and the
      # macos-15 image already ships cargo.
      - name: Build the PTY library
        run: bun run build:native

      # `bun run test`, not `bun test`: the root script is what routes through
      # turbo, and bypassing it skips the native build this job depends on.
      - name: Test
        run: bun run test

  # The native half of the PTY. Separated because it needs a Rust toolchain and a
  # formatting mistake should not pay for a cargo build.
  native:
    name: Build the PTY library
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/pty/native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/pty/native/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --manifest-path packages/pty/native/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path packages/pty/native/Cargo.toml -- -D warnings

      - name: Build
        run: cargo build --release --manifest-path packages/pty/native/Cargo.toml

  # The slow gate: proves the daemon still compiles to a single self-contained
  # binary, which is the property the whole sidecar story rests on. If this breaks,
  # a dependency has pulled in a native addon that `bun build --compile` cannot
  # embed.
  sidecar:
    name: Compile the daemon sidecar
    runs-on: macos-15
    needs: [check, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the database client
        run: bun run generate

      - name: Build the PTY library
        run: bun run build:native

      - name: Compile
        run: bun run daemon:build

      # Running it from an empty directory is the actual test: it proves the
      # runtime, the database client, the emulator and the PTY library are all
      # embedded rather than resolved from node_modules.
      - name: Verify the binary is self-contained
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/isolated"
          cp apps/daemon/janelad "$RUNNER_TEMP/isolated/"
          cd "$RUNNER_TEMP/isolated"
          ./janelad --version

  # The Tauri shell, as a bundle. tauri-build copies `bundle.externalBin` at compile
  # time, so the daemon sidecar is placed first; `tauri build` then builds the
  # frontend and the release binary, assembles Janela.app, and ad-hoc signs both
  # executables with the hardened runtime and `src-tauri/Entitlements.plist`.
  #
  # The verify step at the end of `bun run bundle` is what makes this job worth its
  # minutes: it proves the layout, the sealed LaunchAgent plist, the hardened runtime
  # and the entitlements on every push. Developer ID signing and notarization need
  # credentials this workflow deliberately does not have — they are the release
  # workflow's, and an empty `APPLE_SIGNING_IDENTITY` here would be a worse failure
  # than none at all.
  shell:
    name: Bundle and verify the app
    runs-on: macos-15
    needs: [check, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-shell-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-shell-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate the database client
        run: bun run generate

      - name: Build the PTY library
        run: bun run build:native

      - name: Place the daemon sidecar
        run: bun run --cwd apps/desktop sidecar

      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Bundle, sign (ad-hoc) and verify
        run: bun run --cwd apps/desktop bundle
