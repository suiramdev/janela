# SwiftLint configuration.
#
# swift-format (see .swift-format) owns formatting. SwiftLint is here only for the
# correctness-adjacent rules swift-format does not cover. If a rule is purely
# stylistic and swift-format already decides it, it should be disabled here rather
# than fought in two places.
#
# SwiftLint is optional for local development (`make lint` skips it when absent)
# and required in CI.

included:
  - Packages/JanelaKit/Sources
  - Packages/JanelaKit/Tests
  - App

excluded:
  - Packages/JanelaKit/.build
  - DerivedData

disabled_rules:
  # swift-format's line length is authoritative; see .swift-format.
  - line_length
  # Trailing commas are a formatting concern, and swift-format normalises them.
  - trailing_comma
  # We use `// TODO:` deliberately in the scaffold and track them in issues.
  - todo

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

identifier_name:
  min_length: 3
  excluded:
    # GRDB names its `Database` closure parameter `db` throughout its own API and
    # documentation. Renaming it locally would make our code read differently from
    # every GRDB example without making it clearer.
    - db
    # Universally understood, and `identifier` reads worse.
    - id
    - to
    - up
    - x
    - y

type_name:
  min_length: 3
  max_length: 50

function_body_length:
  warning: 60
  error: 120

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 900
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

force_unwrapping:
  severity: error

reporter: xcode
